# Source of truth for what is secret. Paths are relative to machines/<name>/.
# For each entry, the plaintext file is gitignored and `<path>.vault` is committed.
# After adding a line: `./fleet encrypt`.
fleet_secrets:
  beefunk:
    - docker-compose/.env
    - docker-compose/traefik/acme/acme.json
    - docker-compose/traefik/certs/beefunk.key
    - docker-compose/mpd-dynamic/config/mpd_dynamicrc
    - docker-compose/mpd-dynamic/config/mpd_dynamic-blacklist.txt
    - docker-compose/monitoring/docker-compose.yml   # hardcoded GF_SECURITY_ADMIN_PASSWORD
  brownfunk:
    - docker-compose/.env
    - docker-compose/traefik/acme/acme.json
    - docker-compose/traefik/certs/brownfunk.key
    - docker-compose/monitoring/docker-compose.yml   # hardcoded GF_SECURITY_ADMIN_PASSWORD
    - docker-compose/telegraf.conf                   # hardcoded username/password
  evryfunk:
    - docker-compose/.env
    - docker-compose/immich-app/.env
  evryfunknuc:
    - docker-compose/.env
