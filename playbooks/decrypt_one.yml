- vars:
    dest: "{{ dest_root }}/{{ it.0.key }}/{{ it.1 }}"
  block:
    - ansible.builtin.file: {path: "{{ dest | dirname }}", state: directory, mode: "0755"}
    - ansible.builtin.copy:
        src: "{{ root }}/machines/{{ it.0.key }}/{{ it.1 }}.vault"
        dest: "{{ dest }}"
        mode: "{{ '0600' if (it.1 | basename) in ['.env', 'acme.json'] or it.1.endswith('.key') else '0644' }}"
