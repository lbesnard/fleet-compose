# Local cache in front of the remote Immich on evryfunk.
#
# Immich assets are immutable per ID (thumbnail URLs also carry a checksum in
# the query string), so photos, thumbnails and videos are cached on beefunk and
# served from the LAN after the first view. Everything else (timeline, search,
# login, uploads, websocket) is passed straight through to evryfunk, so the
# database only ever lives in one place and nothing can get out of sync.
#
# Flow: client -> traefik (immich.funkybeefunk.duckdns.org) -> this container
#       -> evryfunk.home:2283 over Tailscale
#
# SECURITY: a cache hit is served without asking Immich who is requesting it.
# Only expose this through beefunk's LAN/Tailscale traefik, never publicly.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Log HIT/MISS/BYPASS and request time on every line
    log_format cache '$remote_addr "$request" $status $body_bytes_sent '
                     'cache=$upstream_cache_status rt=$request_time';
    access_log /dev/stdout cache;
    error_log  /dev/stderr warn;

    # Cache lives on the VM's local disk (named volume). Adjust max_size to the
    # space you can spare; least-recently-used files are evicted beyond it.
    proxy_cache_path /var/cache/nginx/immich levels=1:2 keys_zone=immich:500m
                     max_size=100g inactive=180d use_temp_path=off;

    upstream immich_evryfunk {
        server evryfunk.home:2283;   # pihole: evryfunk.home -> Tailscale IP
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Tells you whether a request came from cache: HIT / MISS / BYPASS ...
    add_header X-Immich-Cache $upstream_cache_status always;

    server {
        listen 80;

        client_max_body_size 0;          # uploads of any size
        proxy_request_buffering off;     # stream uploads instead of spooling them
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # websocket upgrade when asked for, otherwise keepalive to upstream
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # --- thumbnails / previews: small, cache whole ---------------------
        location ~ ^/api/assets/[^/]+/thumbnail {
            proxy_pass http://immich_evryfunk;

            proxy_cache immich;
            proxy_cache_key "$uri$is_args$args";
            proxy_cache_valid 200 180d;
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
            proxy_hide_header Set-Cookie;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating;
        }

        # --- originals and video playback: large, cache in 4 MB slices -----
        # Slicing lets a video start playing (and seek) before the whole
        # file has crossed the world, and caches what has been watched.
        location ~ ^/api/assets/[^/]+/(original|video/playback) {
            slice 4m;
            proxy_pass http://immich_evryfunk;
            # setting any header here drops the server-level ones, so repeat them
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection        "";
            proxy_set_header Range             $slice_range;

            proxy_cache immich;
            proxy_cache_key "$uri$is_args$args$slice_range";
            proxy_cache_valid 200 206 180d;
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
            proxy_hide_header Set-Cookie;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating;
        }

        # --- everything else: straight through, never cached ---------------
        location / {
            proxy_pass http://immich_evryfunk;   # incl. /api/socket.io websocket
            proxy_buffering off;
        }
    }
}
