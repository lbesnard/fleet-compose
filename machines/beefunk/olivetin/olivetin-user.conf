# /etc/systemd/system/OliveTin.service.d/user.conf
# Run as lbesnard: needs ~/.alias_sync, the ssh-agent socket, the docker group and the fleet-compose checkout.
[Service]
User=lbesnard
Group=lbesnard
Environment=HOME=/home/lbesnard
# Dedicated passphrase-less key (README.md): used by funk_rclone and the rsync action instead of the ssh-agent.
Environment=FUNK_SSH_KEY=/home/lbesnard/.ssh/olivetin_ed25519
Environment=PATH=/home/lbesnard/.local/share/zerobrew/prefix/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/bin:/usr/bin:/bin
# Build the rclone task list before the UI comes up (the leading "-" ignores a failure).
ExecStartPre=-/home/lbesnard/github_repo/fleet-compose/machines/beefunk/olivetin/gen-funk-entities.sh
