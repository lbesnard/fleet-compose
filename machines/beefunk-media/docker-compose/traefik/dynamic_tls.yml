tls:
  certificates:
    - certFile: /certs/beefunk.crt
      keyFile: /certs/beefunk.key

  # Optional: Forces Traefik to always default to this cert for all local hosts
  stores:
    default:
      defaultCertificate:
        certFile: /certs/beefunk.crt
        keyFile: /certs/beefunk.key

# One router per remote service, serving both the .lan/.home/.local names and the
# <name>.funkybeefunk.duckdns.org name on HTTPS. Plain HTTP is handled globally by
# the web -> websecure redirect configured on the traefik entrypoint.
# Routers only set `tls: {}`: traefik picks the matching cert from its store - the
# Let's Encrypt wildcard for *.funkybeefunk.duckdns.org, or the self-signed default
# above for the .local names. Do not add a certResolver here; the wildcard is
# requested once by the traefik-dashboard router in docker-compose.yml.
http:
  routers:
    # scrutiny runs on the beefunk-nas VM (next to the disks); no traefik there, so route to it.
    scrutiny:
      rule: "Host(`scrutiny.beefunk.lan`) || Host(`scrutiny.beefunk.home`) || Host(`scrutiny.beefunk.local`) || Host(`scrutiny.funkybeefunk.duckdns.org`)"
      entryPoints:
        - "websecure"
      tls: {}
      service: scrutiny-nas

    # Jellyfin runs in its own LXC (Fleet-Control terraform, lxc_fleet.jellyfin), not in docker.
    jellyfin:
      rule: "Host(`jellyfin.beefunk.lan`) || Host(`jellyfin.beefunk.home`) || Host(`jellyfin.beefunk.local`) || Host(`jellyfin.funkybeefunk.duckdns.org`)"
      entryPoints:
        - "websecure"
      tls: {}
      middlewares:
        - "jellyfin-headers"   # for yatse
      service: jellyfin-lxc

    immich:
      rule: "Host(`immich.beefunk.lan`) || Host(`immich.beefunk.home`) || Host(`immich.beefunk.local`) || Host(`immich.funkybeefunk.duckdns.org`)"
      entryPoints:
        - "websecure"
      tls: {}
      service: immich-remote

    lingodiary:
      rule: "Host(`lingodiary.beefunk.lan`) || Host(`lingodiary.beefunk.home`) || Host(`lingodiary.beefunk.local`) || Host(`lingodiary.funkybeefunk.duckdns.org`)"
      entryPoints:
        - "websecure"
      tls: {}
      service: lingodiary-remote

    sonarr:
      rule: "Host(`sonarr.beefunk.lan`) || Host(`sonarr.beefunk.home`) || Host(`sonarr.beefunk.local`) || Host(`sonarr.funkybeefunk.duckdns.org`)"
      entryPoints:
        - "websecure"
      tls: {}
      service: sonarr-remote

    radarr:
      rule: "Host(`radarr.beefunk.lan`) || Host(`radarr.beefunk.home`) || Host(`radarr.beefunk.local`) || Host(`radarr.funkybeefunk.duckdns.org`)"
      entryPoints:
        - "websecure"
      tls: {}
      service: radarr-remote

    transmission:
      rule: "Host(`transmission-brownfunk.beefunk.lan`) || Host(`transmission-brownfunk.beefunk.home`) || Host(`transmission-brownfunk.beefunk.local`) || Host(`transmission-brownfunk.funkybeefunk.duckdns.org`)"
      entryPoints:
        - "websecure"
      tls: {}
      service: transmission-remote

    jackett:
      rule: "Host(`jackett.beefunk.lan`) || Host(`jackett.beefunk.home`) || Host(`jackett.beefunk.local`) || Host(`jackett.funkybeefunk.duckdns.org`)"
      entryPoints:
        - "websecure"
      tls: {}
      service: jackett-remote

  middlewares:
    jellyfin-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

  services:
    scrutiny-nas:
      loadBalancer:
        servers:
          - url: "http://192.168.8.201:8033"

    jellyfin-lxc:
      loadBalancer:
        servers:
          - url: "http://192.168.8.205:8096"

    immich-remote:
      loadBalancer:
        servers:
          - url: "http://evryfunk.home:2283"

    lingodiary-remote:
      loadBalancer:
        servers:
          - url: "http://evryfunk.home:8084"

    sonarr-remote:
      loadBalancer:
        servers:
          - url: "http://brownfunk.lan:8989"

    radarr-remote:
      loadBalancer:
        servers:
          - url: "http://brownfunk.lan:7878"

    transmission-remote:
      loadBalancer:
        servers:
          - url: "http://brownfunk.lan:9091"

    jackett-remote:
      loadBalancer:
        servers:
          - url: "http://brownfunk.lan:9117"

  serversTransports:
    digikam-tls:
      insecureSkipVerify: true
    darktable-tls:
      insecureSkipVerify: true

