# entryPoints:
#   websecure:
#     address: ":443"
#     transport:
#       respondingTimeouts:
#         readTimeout: 60s
#         idleTimeout: 300s
#
tls:
  certificates:
    - certFile: /certs/brownfunk.crt
      keyFile: /certs/brownfunk.key

  # Optional: Forces Traefik to always default to this cert for all local hosts
  stores:
    default:
      defaultCertificate:
        certFile: /certs/brownfunk.crt
        keyFile: /certs/brownfunk.key

# Plain http: redirect everything to https. Priority 1 so that the explicit
# `web` routers (homer-lan on the bare brownfunk.lan host) win.
http:
  routers:
    http-to-https:
      rule: "HostRegexp(`.+`)"
      entryPoints:
        - "web"
      priority: 1
      middlewares:
        - "redirect-to-https"
      service: noop@internal

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true
