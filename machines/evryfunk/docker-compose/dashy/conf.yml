# Dashy Configuration - Evryfunk
# Full docs here: https://dashy.to/docs/configuring

pageInfo:
  title: Evryfunk Dashboard
  description: Local Services & Infrastructure
  navLinks:
    - title: Server Howto
      path: http://hedgedoc.funkybrownfunk.duckdns.org/s/H1tA_LShH
      target: newtab
    - title: Brownfunk Homepage
      path: http://home.funkybrownfunk.duckdns.org
      target: newtab
    - title: Beefunk Homepage
      path: http://home.funkybeefunk.duckdns.org
      target: newtab
    - title: Evryfunk Homepage
      path: http://home.funkyevryfunk.duckdns.org
      target: newtab
  footer: |
    Created with ❤️ | <a href="http://hedgedoc.funkybrownfunk.duckdns.org/s/H1tA_LShH" target="_blank">Server Howto</a>

appConfig:
  theme: nord
  statusCheck: true
  statusCheckInterval: 100
  statusCheckAccessibility: true
  pingCheckEnabled: true
  pingCheckInterval: 100
  pingCheckAccessibility: true
  defaultOpeningMethod: newtab
  language: en
  webSearch:
    searchEngine: 'duckduckgo'
    openingMethod: 'newtab'
    searchBangs:
      /r: reddit
      /w: wikipedia
      /a: https://www.amazon.co.uk/s?k=
      ':wolf': wolframalpha
      ':so': stackoverflow
      ':git': github

sections:
  - name: home-widgets
    widgets:
      - type: clock
        options:
          timezone: Europe/Paris
      - type: xkcd-comic
        options:
          comic: latest

  - name: Media Streaming
    icon: fas fa-film
    items:
      - title: Movies
        description: Jellyfin - media streaming
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jellyfin.png
        url: https://jellyfin.funkyevryfunk.duckdns.org
        tags: [media]

      - title: Music
        description: Navidrome - music streaming (brownfunk)
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/navidrome.png
