  mealie:
    # image: ghcr.io/mealie-recipes/mealie:v2.7.1 #
    image: ghcr.io/mealie-recipes/mealie:latest #
    container_name: mealie
    restart: always
    ports:
      - "9925:9000" #
    deploy:
      resources:
        limits:
          memory: 1000M #
    volumes:
      - $DOCKER_CONFIG_PATH/mealie/data/:/app/data
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: $TZ
      OPENAI_API_KEY: $OPENAI_API_KEY
      BASE_URL: https://mealie.evryfunk.home

  tubearchivist:
    image: bbilly1/tubearchivist:latest
    container_name: tubearchivist
    restart: unless-stopped
    # v0.6.0+: no HOST_UID/HOST_GID any more, TA no longer chowns anything. Run as 1000 and, once:
    #   sudo chown -R 1000:1000 /media/efunk_6tb_1/tube_archivist /opt/docker_config/tubearchivist/{cache,es}
    user: "${PUID_USER}:${PGID_USER}"
    ports:
      - "8000:8000"
    volumes:
      - $TUBEARCHIVIST_PATH:/youtube
      - $DOCKER_CONFIG_PATH/tubearchivist/cache:/cache
    environment:
      - ES_URL=http://archivist-es:9200
      - REDIS_CON=redis://archivist-redis:6379
      - TA_HOST=https://tubearchivist.${TRAEFIK_DUCKDNS_DOMAIN}.duckdns.org https://tubearchivist.${SERVER_DOMAIN}.lan https://tubearchivist.${SERVER_DOMAIN}.home https://tubearchivist.${SERVER_DOMAIN}.local http://${SERVER_DOMAIN}.home:8000 http://${SERVER_LAN_IP}:8000
      - TA_USERNAME=$TA_USERNAME
      - TA_PASSWORD=$TA_PASSWORD
      - ELASTIC_PASSWORD=$TA_ELASTIC_PASSWORD
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - archivist-es
      - archivist-redis
    networks:
      - default
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: true
      traefik.docker.network: proxy
      traefik.http.routers.tubearchivist.rule: Host(`tubearchivist.${SERVER_DOMAIN}.lan`) || Host(`tubearchivist.${SERVER_DOMAIN}.home`) || Host(`tubearchivist.${SERVER_DOMAIN}.local`) || Host(`tubearchivist.${TRAEFIK_DUCKDNS_DOMAIN}.duckdns.org`)
      traefik.http.routers.tubearchivist.entrypoints: websecure
      traefik.http.routers.tubearchivist.tls: true
      traefik.http.services.tubearchivist.loadbalancer.server.port: 8000

  archivist-redis:
    image: redis:latest
    container_name: archivist-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - $DOCKER_CONFIG_PATH/tubearchivist/redis:/data
    depends_on:
      - archivist-es
    labels:
      com.centurylinklabs.watchtower.enable: true

  # Elasticsearch needs a higher mmap limit on the host, or it fails to start:
  #   sudo sysctl -w vm.max_map_count=262144
  # and to make it survive a reboot:
  #   echo "vm.max_map_count=262144" | sudo tee /etc/sysctl.d/99-elasticsearch.conf
  archivist-es:
    image: bbilly1/tubearchivist-es:latest # official elasticsearch image with the version TA pins
    container_name: archivist-es
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=$TA_ELASTIC_PASSWORD
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - discovery.type=single-node
      - path.repo=/usr/share/elasticsearch/data/snapshot
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - $DOCKER_CONFIG_PATH/tubearchivist/es:/usr/share/elasticsearch/data
    expose:
      - "9200"
    labels:
      # ES major upgrades need a matching TA release; update by hand, not via watchtower
      com.centurylinklabs.watchtower.enable: false

  filebrowserquantum:
    image: gtstef/filebrowser:latest
    container_name: filebrowserquantum
    environment:
      - FILEBROWSER_CONFIG=/config/config.yaml
      - TZ=$TZ
      - WATCHTOWER_CLEANUP=true
    user: "${PUID_USER}:${PGID_USER}"
    ports:
      - 9295:80
    volumes:
      - $DOCKER_CONFIG_PATH/filebrowserquantum/data:/data
      - ./filebrowser/config.yaml:/config/config.yaml:ro
      - $MOVIES_PATH:/srv/media/movies:ro
      - $PICTURES_PATH:/srv/media/pictures:ro
      - $TORRENT_PATH:/srv/media/torrent:ro
      - $SHARE_PATH:/srv/media/share

  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    user: "${PUID_USER}:${PGID_USER}"
    environment:
      - TZ=$TZ
      - XDG_CONFIG_HOME=/hist   # persistent state (filekeys), /cfg is read-only
    ports:
      - 3923:3923
    volumes:
      - ./copyparty/cfg:/cfg:ro
      - $DOCKER_CONFIG_PATH/copyparty/hist:/hist
      - $SHARE_PATH/copyparty:/w/share
    restart: unless-stopped
 
  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    cap_add:
      - SYS_RAWIO
    ports:
      - "8033:8080" # webapp
      - "8086:8086" # influxDB admin
    volumes:
      - /run/udev:/run/udev:ro
      - $DOCKER_CONFIG_PATH/scrutiny/config:/opt/scrutiny/config
      - $DOCKER_CONFIG_PATH/scrutiny/influxdb:/opt/scrutiny/influxdb
    devices:
      - "/dev/sdb"
    environment:
      - COLLECTOR_CRON_SCHEDULE="*/5 * * * *"
      - PUID=$PUID_USER
      - PGID=$PGID_USER
      - TZ=$TZ
      - WATCHTOWER_CLEANUP=true
    labels:
      com.centurylinklabs.watchtower.enable: true

  lingodiary:
    container_name: lingodiary
    image: lozzaroo/lingodiary
    ports:
      - 8084:8084
    volumes:
      - $DOCKER_CONFIG_PATH/lingoDiary/:/app/.config/lingoDiary/ # Mount config file to /app inside the container
      # - /media/efunk_4tb_1/lingodiary/laurent/:/data/laurent/
      # - /media/efunk_4tb_1/lingodiary/johanne/:/data/johanne/
      # - /media/efunk_4tb_1/lingodiary/claudine/:/data/claudine/
      - /media/efunk_4tb_1/lingodiary/:/data/
    environment:
      # CONFIG_PATH: /app/.config/lingoDiary/config.yaml # Update path to reflect /app location
      SECRET_KEY: "4dea2020568dca5f8ad784e3110283fcf82f87c50c12f47b9a56ae95f572b0d2" # python -c "import secrets; print(secrets.token_hex(32))"
      # CONFIG_ROOT: /app/.config/lingoDiary # Update path to reflect /app location
      # USER_DB_FILE: /app/.config/lingoDiary/users.yaml # users password defined with python -c "import bcrypt; print(bcrypt.hashpw(b'mysecret', bcrypt.gensalt()).decode())"
    user: "1000:1000" # Run container as non-root user
    restart: always

