# crazymax/samba config (see https://github.com/crazy-max/docker-samba).
# The password of the main user is not here: it comes from the samba_password docker
# secret, built from SAMBA_PICTURES_PASSWORD in .env.
auth:
  - user: claudine
    group: claudine
    uid: 1000
    gid: 1000
    password_file: /run/secrets/samba_password
  - user: guest
    group: guest
    uid: 1100
    gid: 1100
    password: guest

global:
  - "map to guest = Bad User"
  - "guest account = nobody"
  - "force user = claudine"
  - "force group = claudine"

share:
  - name: "Shared"
    path: /share6
    browsable: yes
    readonly: no
    guestok: yes
    validusers: guest
    writelist: guest
    veto: no
    recycle: no
  - name: "Films"
    path: /share4
    browsable: yes
    readonly: no
    guestok: yes
    validusers: guest
    writelist: guest
    veto: no
    recycle: no
  - name: "Pictures"
    path: /share5
    browsable: yes
    readonly: no
    guestok: yes
    validusers: claudine,guest
    writelist: claudine,guest
    veto: no
    recycle: no

