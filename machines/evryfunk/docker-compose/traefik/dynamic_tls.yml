tls:
  certificates:
    - certFile: /certs/evryfunk.crt
      keyFile: /certs/evryfunk.key

  # Forces Traefik to always default to this cert for all local hosts
  stores:
    default:
      defaultCertificate:
        certFile: /certs/evryfunk.crt
        keyFile: /certs/evryfunk.key

# One router per service that is not a labelled container, serving both the
# .lan/.home/.local names and the <name>.funkyevryfunk.duckdns.org name on HTTPS.
# Routers only set `tls: {}`: traefik picks the matching cert from its store - the
# Let's Encrypt wildcard for *.funkyevryfunk.duckdns.org, or the self-signed default
# above for the .local names. Do not add a certResolver here; the wildcard is
# requested once by the traefik-dashboard router in docker-compose.yml.
#
# Services on this machine are reached through their published ports via
# host.docker.internal (extra_hosts on the traefik container), so their direct
# http://evryfunk.lan:<port> access keeps working. Services of brownfunk replace the
# former portforward_* containers.
http:
  routers:
    # Plain http: redirect everything to https. Priority 1 so that the explicit
    # `web` routers (homer on the bare evryfunk.lan host) win.
    http-to-https:
      rule: "HostRegexp(`.+`)"
      entryPoints:
        - "web"
      priority: 1
      middlewares:
        - "redirect-to-https"
      service: noop@internal

    # --- local services (evryfunk) ---
    jellyfin:
      rule: "Host(`jellyfin.evryfunk.lan`) || Host(`jellyfin.evryfunk.home`) || Host(`jellyfin.evryfunk.local`) || Host(`jellyfin.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: jellyfin

    nextcloud:
      rule: "Host(`nextcloud.evryfunk.lan`) || Host(`nextcloud.evryfunk.home`) || Host(`nextcloud.evryfunk.local`) || Host(`nextcloud.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: nextcloud

    immich:
      rule: "Host(`immich.evryfunk.lan`) || Host(`immich.evryfunk.home`) || Host(`immich.evryfunk.local`) || Host(`immich.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: immich

    immich-kiosk:
      rule: "Host(`immich-kiosk.evryfunk.lan`) || Host(`immich-kiosk.evryfunk.home`) || Host(`immich-kiosk.evryfunk.local`) || Host(`immich-kiosk.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: immich-kiosk

    mealie:
      rule: "Host(`mealie.evryfunk.lan`) || Host(`mealie.evryfunk.home`) || Host(`mealie.evryfunk.local`) || Host(`mealie.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: mealie

    lingodiary:
      rule: "Host(`lingodiary.evryfunk.lan`) || Host(`lingodiary.evryfunk.home`) || Host(`lingodiary.evryfunk.local`) || Host(`lingodiary.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: lingodiary

    tandoor:
      rule: "Host(`tandoor.evryfunk.lan`) || Host(`tandoor.evryfunk.home`) || Host(`tandoor.evryfunk.local`) || Host(`tandoor.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: tandoor

    filebrowser:
      rule: "Host(`filebrowser.evryfunk.lan`) || Host(`filebrowser.evryfunk.home`) || Host(`filebrowser.evryfunk.local`) || Host(`filebrowser.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: filebrowser

    copyparty:
      rule: "Host(`copyparty.evryfunk.lan`) || Host(`copyparty.evryfunk.home`) || Host(`copyparty.evryfunk.local`) || Host(`copyparty.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: copyparty

    scrutiny:
      rule: "Host(`scrutiny.evryfunk.lan`) || Host(`scrutiny.evryfunk.home`) || Host(`scrutiny.evryfunk.local`) || Host(`scrutiny.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: scrutiny

    firefox:
      rule: "Host(`firefox.evryfunk.lan`) || Host(`firefox.evryfunk.home`) || Host(`firefox.evryfunk.local`) || Host(`firefox.funkyevryfunk.duckdns.org`)"
