    pihole:
      rule: "Host(`pihole.evryfunk.lan`) || Host(`pihole.evryfunk.home`) || Host(`pihole.evryfunk.local`) || Host(`pihole.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
