    transmission:
      rule: "Host(`transmission.evryfunk.lan`) || Host(`transmission.evryfunk.home`) || Host(`transmission.evryfunk.local`) || Host(`transmission.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
