      entryPoints: ["websecure"]
      tls: {}
      service: aerofoil

    # --- remote services (brownfunk), replace the former portforward_* containers ---
    radarr-fr:
      rule: "Host(`radarr-fr.evryfunk.lan`) || Host(`radarr-fr.evryfunk.home`) || Host(`radarr-fr.evryfunk.local`) || Host(`radarr-fr.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: radarr-fr-remote

    radarr-fr-port:
      rule: "PathPrefix(`/`)"
      entryPoints: ["radarr-fr"]
      service: radarr-fr-remote

    calibre-web:
      rule: "Host(`calibre-web.evryfunk.lan`) || Host(`calibre-web.evryfunk.home`) || Host(`calibre-web.evryfunk.local`) || Host(`calibre-web.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: calibre-web-remote

    calibre-web-port:
      rule: "PathPrefix(`/`)"
      entryPoints: ["calibre-web"]
      service: calibre-web-remote

    calibre:
      rule: "Host(`calibre.evryfunk.lan`) || Host(`calibre.evryfunk.home`) || Host(`calibre.evryfunk.local`) || Host(`calibre.funkyevryfunk.duckdns.org`)"
      entryPoints: ["websecure"]
      tls: {}
      service: calibre-remote

    calibre-port:
      rule: "PathPrefix(`/`)"
      entryPoints: ["calibre"]
      service: calibre-remote

    navidrome:
      rule: "Host(`navidrome.evryfunk.lan`) || Host(`navidrome.evryfunk.home`) || Host(`navidrome.evryfunk.local`) || Host(`navidrome.funkyevryfunk.duckdns.org`)"
