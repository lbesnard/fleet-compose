      entryPoints: ["websecure"]
      tls: {}
      service: shelfmark-remote

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8096"
    nextcloud:
      loadBalancer:
        serversTransport: insecure-tls
        servers:
          - url: "https://host.docker.internal:9393"
    immich:
