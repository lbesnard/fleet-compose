# crazymax/samba config (see https://github.com/crazy-max/docker-samba).
# The password of the main user is not here: it comes from the samba_password docker
# secret, built from SAMBA_PASSWORD in .env.
auth:
  - user: lbesnard
    group: lbesnard
    uid: 1000
    gid: 1000
    password_file: /run/secrets/samba_password
  - user: guest
    group: guest
    uid: 1100
    gid: 1100
    password: guest

global:
  - "map to guest = Bad User"
  - "guest account = nobody"
  - "force user = lbesnard"
  - "force group = lbesnard"

share:
  - name: "Pictures"
    path: /share5
    browsable: yes
    readonly: no
    guestok: no
    validusers: lbesnard
    writelist: lbesnard
    veto: no
    recycle: no

